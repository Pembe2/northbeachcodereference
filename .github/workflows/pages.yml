name: Deploy production and development previews

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production
        uses: actions/checkout@v4
        with:
          ref: main
          path: prod

      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: development
          path: dev

      - name: Build Pages artifact
        run: |
          mkdir -p public/dev
          rsync -a --delete --exclude='.git*' --exclude='.github' prod/ public/
          mkdir -p public/dev
          rsync -a --delete --exclude='.git*' --exclude='.github' dev/ public/dev/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
